c": "白い部屋に入ってきたのは、自分と同じ顔の男だった。"}, "50": {"title": "迷子の大人", "rarity": "COMMON", "desc": "適当に歩き続けたら、自宅への道が分からなくなった。"}, "51": {"title": "山の向こう", "rarity": "RARE", "desc": "電車の終点のさらに先まで歩いた。そこにも街は続いていた。"}, "52": {"title": "海", "rarity": "COMMON", "desc": "夕暮れの海。水平線の向こうに、人影が立っているように見えた。"}, "53": {"title": "落とし物", "rarity": "COMMON", "desc": "道端で財布を拾った。それが一日の流れを変えた。"}, "54": {"title": "ネコババ", "rarity": "COMMON", "desc": "拾った財布を自分のものにした。妙な罪悪感だけが残った。"}, "55": {"title": "100万円", "rarity": "RARE", "desc": "財布の中には、ありえないほどの大金が入っていた。"}, "56": {"title": "持ち主", "rarity": "EPIC", "desc": "財布を返すと「前にも返してくれたね」と言われた。"}, "57": {"title": "宝くじ", "rarity": "RARE", "desc": "適当に買った一枚が大当たりした。"}, "58": {"title": "当選番号", "rarity": "EPIC", "desc": "当選番号を、発表される前から知っていた。"}, "59": {"title": "億万長者", "rarity": "LEGEND", "desc": "知っている未来を使って、人生を変えるだけの金を手に入れた。"}, "60": {"title": "意味がない", "rarity": "EPIC", "desc": "どれだけ金を得ても、0時を越えれば全部が戻ると気づいた。"}, "61": {"title": "デジャヴ", "rarity": "RARE", "desc": "同じ景色を何度も見た気がした。"}, "62": {"title": "知っているニュース", "rarity": "RARE", "desc": "ニュースキャスターより先に、次の言葉が口から出た。"}, "63": {"title": "次は右", "rarity": "EPIC", "desc": "曲がり角の先で何が起きるか、なぜか知っていた。"}, "64": {"title": "また？", "rarity": "EPIC", "desc": "事故を見た瞬間、自分は確かに「また」と言った。"}, "65": {"title": "夢じゃない", "rarity": "EPIC", "desc": "これは夢じゃない。記憶だけが、確かに次の日へ残っている。"}, "66": {"title": "昨日のメモ", "rarity": "LEGEND", "desc": "机の上に、自分の字で「電話に出るな」と書かれていた。"}, "67": {"title": "電話に出ない", "rarity": "RARE", "desc": "知らない番号を無視した。けれど胸騒ぎは消えなかった。"}, "68": {"title": "電話は鳴り続ける", "rarity": "EPIC", "desc": "番号を変えて、何度でも電話は鳴った。"}, "69": {"title": "公衆電話", "rarity": "EPIC", "desc": "携帯を捨てたのに、目の前の公衆電話が鳴り始めた。"}, "70": {"title": "私を見つけて", "rarity": "LEGEND", "desc": "「0時になる前に、私を見つけて。」声は震えていた。"}, "71": {"title": "赤い傘", "rarity": "EPIC", "desc": "街中の赤い傘を追い続けた。"}, "72": {"title": "人違い", "rarity": "COMMON", "desc": "追いかけた相手は、まったく知らない人だった。"}, "73": {"title": "彼女", "rarity": "LEGEND", "desc": "電話の声の主が、目の前に立っていた。"}, "74": {"title": "初対面じゃない", "rarity": "LEGEND", "desc": "「これで let state=load(); let returnTo='title';
function blank(){return {got:[],runs:0,last:null}}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return x&&Array.isArray(x.got)?{...blank(),...x}:blank()}catch(e){return blank()}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){} updateCount()}
function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0)}
function updateCount(){const n=state.got.length;titleCount.textContent=`ENDING COLLECTION ${n} / 100`;ccount.textContent=`${n} / 100`;bar.style.width=n+'%'}
function has(n){return state.got.includes(n)}
function prereq(n){if(n===100)return state.got.length===99 && !has(100);const a=needs[n]||[];return a.every(has)}
function routeVisible(r){if(r.need&&!has(r.need))return false;return state.got.length>=(r.min||0)}
function availableEnds(r){return r.ends.filter(n=>!has(n)&&prereq(n)).slice(0,8)}
function storyScene(time,place,html,buttons){stime.textContent=time;splace.textContent=place;storybox.innerHTML=html;choices.innerHTML='';buttons.forEach(b=>{const x=document.createElement('button');x.className='btn';x.type='button';x.innerHTML=b.label+(b.sub?`<small>${b.sub}</small>`:'');x.addEventListener('click',b.go);choices.appendChild(x)});show('story')}
function morning(){state.runs++;save();const btns=[];routes.filter(routeVisible).forEach(r=>btns.push({label:r.label,sub:r.id==='final'?'これまでの記憶が一本の道に繋がっている。':'',go:()=>openRoute(r)}));storyScene('7:00','自室',`<p>ピピピピ——。</p><p>目覚ましの音で目を覚ました。</p><p>${state.runs===1?'今日も、いつもと変わらない一日が始まる。':state.runs<10?'また朝が来た。少しだけ、昨日と同じ匂いがする。':state.runs<50?'……また、この朝だ。':'今日が何度目なのか、もう数えるのをやめた。'}</p>`,btns)}
function openRoute(r){const av=availableEnds(r);const btns=[];if(av.length)av.forEach(n=>btns.push({label:choiceLabel(n),sub:choiceSub(n),go:()=>preEnding(r,n)}));else btns.push({label:'今日は別のことをする',go:morning});storyScene(r.time,r.place,`<div class="routeTag">${r.label}</div><p>${r.intro}</p><p class="hint">この場面では、今の記憶で選べる行動だけが表示されています。</p>`,btns)}
function choiceLabel(n){const map={1:'真面目に一日を終える',2:'もう一度寝る',3:'連絡せず休む',4:'勝っているうちに帰る',5:'さらに勝負する',6:'知らない番号に出る',7:'いつもの道を行く',8:'事故現場へ先回りする',9:'遅刻してでも向かう',10:'きちんと休む',11:'ゲームだけして過ごす',12:'映画館へ行く',13:'一日中食べ歩く',14:'健康的に過ごす',15:'欲しい物を全部買う',16:'部屋を掃除する',17:'誰にも会わない',18:'公園でゆっくりする',19:'終電まで遊ぶ',20:'23:59まで歩く',21:'旧友に会う',22:'冷たい言葉を選ぶ',23:'謝る',24:'親切を続ける',25:'告白を断る',26:'告白を受ける',27:'明日の約束をする',28:'約束の場所で待つ',29:'街を探し回る',30:'いつもの逆順で探す',31:'家族と過ごす',32:'大事な話を避ける',33:'ありがとうと伝える',34:'昔話を聞く',35:'アルバムを見る',36:'迷子を助ける',37:'危険な場所へ飛び込む',38:'全部見て見ぬふりをする',39:'困っている人を全部助ける',40:'街中の人に話しかける',41:'怪しい場所をうろつく',42:'さらに警察を困らせる',43:'逃げる',44:'高いビルの屋上へ',45:'エレベーターに乗り続ける',46:'13階を押す',47:'白い部屋へ入る',48:'椅子に座る',49:'もう一人を待つ',50:'知らない道だけを選ぶ',51:'電車の終点へ',52:'海へ行く',53:'財布を拾う',54:'財布を持ち帰る',55:'中身を確認する',56:'持ち主へ返す',57:'宝くじを一枚買う',58:'覚えている番号を選ぶ',59:'大量に買う',60:'金を捨てて0時を待つ',61:'同じ場所を何度も歩く',62:'ニュースを先読みする',63:'次の角を予言する',64:'事故を見届ける',65:'記憶を整理する',66:'机のメモを読む',67:'電話に出ない',68:'何度でも無視する',69:'携帯を捨てる',70:'公衆電話に出る',71:'赤い傘を追う',72:'最初の赤い傘を追う',73:'声の主を探す',74:'何回目か聞く',75:'自分の記憶を疑う',76:'23:59まで起きる',77:'0時を見る',78:'外へ出る',79:'動く人影を探す',80:'人影を追う',81:'走り続ける',82:'逆方向へ回り込む',83:'未来の自分の話を聞く',84:'電話の矛盾を考える',85:'0時の先を見る',86:'100回目の朝を迎える',87:'何も選ばない',88:'選択肢にない道へ行く',89:'自分の名前を調べる',90:'街の外へ出る',91:'境界に触れる',92:'境界を越える',93:'白い空間を進む',94:'観測者に問いかける',95:'画面の向こうを見る',96:'彼女の過去を聞く',97:'最初の日を思い出す',98:'事故を完全に防ぐ',99:'今日を手放す',100:'明日へ進む'};return map[n]||endings[n].title}
function choiceSub(n){if(n>=96)return '物語の核心へ進む';if(n>=86)return 'SECRET ROUTE';if(n>=76)return '0時の世界に関わる';if(n>=61)return 'ループの違和感を追う';return ''}
function preEnding(r,n){const e=endings[n];let body=`<div class="routeTag">${e.rarity}</div><p>${lead(n)}</p>`;const btns=[{label:'この行動を選ぶ',go:()=>finish(n)},{label:'やめておく',go:()=>openRoute(r)}];storyScene(nextTime(n),r.place,body,btns)}
function lead(n){const e=endings[n];if(n===100)return '彼女が隣にいる。23:59。今まで一度も選べなかった答えが、胸の中にはっきり浮かんでいる。';if(n>=96)return 'ここまでの記憶が、目の前の出来事の意味を変えている。もう引き返せない。';if(n>=86)return '普通なら存在しないはずの選択肢だ。それでも、今なら選べる。';if(n>=76)return '時計の秒針が、いつもより大きな音を立てている。';return `この選択の先に、何かが待っている気がする。`}
function nextTime(n){if(n>=76)return '23:59';if(n>=61)return '18:40';if(n>=41)return '16:20';if(n>=21)return '15:10';return '12:00'}
function finish(n){const e=endings[n];const isNew=!has(n);if(isNew)state.got.push(n);state.got.sort((a,b)=>a-b);state.last=n;save();newEl.classList.toggle('hidden',!isNew);eno.textContent='END '+String(n).padStart(3,'0');etitle.textContent=e.title;erarity.textContent=e.rarity;edesc.textContent=e.desc;show('end')}
function drawCollection(){grid.innerHTML='';for(let n=1;n<=100;n++){const e=endings[n],got=has(n);const d=document.createElement('button');d.type='button';d.className='cell'+(got?' got':'');d.innerHTML=`<span class="num">${String(n).padStart(3,'0')}</span><span class="name">${got?e.title:'？？？？？'}</span>`;d.addEventListener('click',()=>{detail.innerHTML=got?`<b>END ${String(n).padStart(3,'0')}｜${e.title}</b><br><span class="small">${e.rarity}</span><br><br>${e.desc}`:'まだ見ていないエンディングです。';});grid.appendChild(d)}updateCount()}
function drawMemory(){const msgs=[];const n=state.got.length;msgs.push(['周回','この朝を '+state.runs+' 回迎えている。']);if(has(7))msgs.push(['事故の記憶','あの交差点で何が起きるか覚えている。']);if(has(6))msgs.push(['知らない声','「明日のあなたを知ってる人。」という言葉が残っている。']);if(has(16))msgs.push(['今日の日付の写真','今日撮られたはずのない写真を見つけた。']);if(has(40))msgs.push(['街の違和感','この街は自分のことを知りすぎている。']);if(has(60))msgs.push(['0時の法則','金も結果も、0時を越えれば意味を失う。']);if(has(65))msgs.push(['ループの自覚','夢ではない。記憶だけが残っている。']);if(has(75))msgs.push(['27回目','自分が覚えていない周回が存在する。']);if(has(85))msgs.push(['0時01分','世界は0時の先を隠している。']);if(has(95))msgs.push(['観測者','選択しているのは、自分だけではない。']);if(has(99))msgs.push(['最後の答え','終わらせるには、この日を手放さなければならない。']);if(n===100)msgs.push(['明日','日付は変わった。']);memlist.innerHTML=msgs.map(x=>`<div><b>${x[0]}</b><span class="small">${x[1]}</span></div>`).join('')}

startBtn.onclick=morning;collectionBtn.onclick=()=>{returnTo='title';drawCollection();show('collect')};memoryBtn.onclick=()=>{returnTo='title';drawMemory();show('memscreen')};resetBtn.onclick=()=>{if(confirm('セーブデータをすべて初期化しますか？')){state=blank();save();drawCollection();alert('初期化しました。')}};nextBtn.onclick=morning;endCollectionBtn.onclick=()=>{returnTo='end';drawCollection();show('collect')};endTitleBtn.onclick=()=>show('title');back1Btn.onclick=()=>show(returnTo);back2Btn.onclick=()=>show(returnTo);
