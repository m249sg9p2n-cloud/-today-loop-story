<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>今日が終わるまでに。</title>
<style>
:root{--bg:#0d1016;--panel:#151922;--panel2:#1c2230;--text:#f4f7fb;--muted:#a8b0be;--line:#2a3140;--accent:#edf1f8;--gold:#e9d49a;--rare:#b8c7ff;--epic:#d6b8ff;--legend:#ffd59a;--secret:#ffb8de}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100%}body{display:flex;justify-content:center}button{font:inherit}
.app{width:100%;max-width:540px;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}.hidden{display:none!important}
.center{min-height:89vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.title{font-family:serif;font-size:34px;letter-spacing:.08em;margin:0 0 7px}.subtitle{font-size:11px;color:var(--muted);letter-spacing:.2em;margin-bottom:28px}.count{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold);margin-bottom:22px}
.menu,.choices{display:grid;gap:10px;width:100%}.btn{width:100%;min-height:52px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);text-align:left}.btn:active{transform:scale(.99);background:var(--panel2)}.btn.primary{text-align:center;font-weight:700;background:var(--accent);color:#10131a;border-color:transparent}.btn.ghost{text-align:center;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;gap:12px;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}.time{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace}.place{font-size:13px;color:var(--muted)}
.story{min-height:245px;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--panel),#12161e);display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:15px}.story p{margin:.55em 0;line-height:1.9}.story .big{font-size:22px;font-weight:800}.hint{font-size:12px;color:var(--muted);margin-top:10px}
.routeTag{font-size:11px;letter-spacing:.16em;color:var(--gold);margin-bottom:8px}.routeChoices{display:grid;gap:9px}.routeChoices .btn small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.endcard{min-height:88vh;display:flex;flex-direction:column;justify-content:center;text-align:center}.newbadge{align-self:center;padding:6px 11px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-size:11px;margin-bottom:16px}.endno{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);letter-spacing:.18em}.endtitle{font-family:serif;font-size:34px;margin:11px 0}.rarity{font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:24px}.enddesc{line-height:1.9;color:#d9dee8;margin:0 auto 27px;max-width:430px}
.head{display:flex;justify-content:space-between;align-items:end;margin:8px 0 14px}.head h2{font-family:serif;margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px;display:flex;flex-direction:column;justify-content:space-between}.cell.got{background:#1b2230;border-color:#667085}.num{font-size:10px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.name{font-size:10px;line-height:1.25}.detail{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:15px;line-height:1.7}.small{font-size:12px;color:var(--muted)}
.mem{display:grid;gap:10px}.mem>div{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px}.progress{height:7px;background:#202633;border-radius:99px;overflow:hidden;margin:8px 0 16px}.progress span{display:block;height:100%;background:var(--accent)}
.notice{font-size:11px;color:var(--muted);margin-top:14px;text-align:center}@media(max-width:360px){.grid{grid-template-columns:repeat(3,1fr)}.title{font-size:29px}}

#bgmToggle{
  position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));

  color:#f4f7fb;border-radius:999px;padding:8px 11px;font-size:12px;

  box-shadow:0 6px 20px rgba(0,0,0,.2)
}
#storybox{cursor:pointer;user-select:none;-webkit-user-select:none}
#storybox.typing::after{

}

function blank(){return {got:[],runs:0,last:null}}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return x&&Array.isArray(x.got)?{...blank(),...x}:blank()}catch(e){return blank()}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){} updateCount()}
function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0)}
function updateCount(){const n=state.got.length;titleCount.textContent=`ENDING COLLECTION ${n} / 100`;ccount.textContent=`${n} / 100`;bar.style.width=n+'%'}
function has(n){return state.got.includes(n)}
function prereq(n){if(n===100)return state.got.length===99 && !has(100);const a=needs[n]||[];return a.every(has)}
function routeVisible(r){if(r.need&&!has(r.need))return false;return state.got.length>=(r.min||0)}
function availableEnds(r){return r.ends.filter(n=>!has(n)&&prereq(n)).slice(0,8)}
let typingToken=0;
function typeHTML(target,html,onDone){
  const token=++typingToken;
  const temp=document.createElement('div');temp.innerHTML=html;
  target.innerHTML='';target.classList.add('typing');
  const queue=[];
  function build(src,parent){
    src.childNodes.forEach(node=>{
      if(node.nodeType===Node.TEXT_NODE){
        const text=document.createTextNode('');parent.appendChild(text);
        queue.push({node:text,text:node.nodeValue||'',i:0});
      }else if(node.nodeType===Node.ELEMENT_NODE){
        const el=document.createElement(node.tagName);
        [...node.attributes].forEach(a=>el.setAttribute(a.name,a.value));
        parent.appendChild(el);build(node,el);
      }
    });
  }
  build(temp,target);
  let qi=0, timer=null, done=false;
  const finish=()=>{
    if(done||token!==typingToken)return;
    done=true;if(timer)clearTimeout(timer);
    target.innerHTML=html;target.classList.remove('typing');
    target.onclick=null;onDone&&onDone();
  };
  target.onclick=finish;
  function tick(){
    if(done||token!==typingToken)return;
    while(qi<queue.length && queue[qi].i>=queue[qi].text.length)qi++;
    if(qi>=queue.length){finish();return}
    const q=queue[qi], ch=q.text[q.i++];
    q.node.nodeValue+=ch;
    let delay=34;
    if(/[。！？!?]/.test(ch))delay=240;
    else if(/[、，,]/.test(ch))delay=105;
    else if(/[—…]/.test(ch))delay=130;
    timer=setTimeout(tick,delay);
  }
  tick();
}
function storyScene(time,place,html,buttons,sceneKey=''){
  setSceneArt(sceneKey);
  stime.textContent=time;splace.textContent=place;choices.innerHTML='';
  choices.classList.add('waiting');
  show('story');
  typeHTML(storybox,html,()=>{
    buttons.forEach(b=>{
      const x=document.createElement('button');x.className='btn';x.type='button';
      x.innerHTML=b.label+(b.sub?`<small>${b.sub}</small>`:'');
      x.addEventListener('click',b.go);choices.appendChild(x)
    });
    requestAnimationFrame(()=>choices.classList.remove('waiting'));
  });
}

/* Original generative ambient BGM — no external audio file */
let audioCtx=null,bgmMaster=null,bgmTimer=null,bgmOn=true,bgmStep=0;
const bgmProgressions=[
  [220.00,261.63,329.63],
  [196.00,246.94,293.66],
  [174.61,220.00,261.63],
  [196.00,246.94,329.63]
];
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    bgmMaster=audioCtx.createGain();
    bgmMaster.gain.value=.055;
    bgmMaster.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function playTone(freq,start,dur,vol=.10,type='sine'){
  if(!audioCtx||!bgmMaster)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
  o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=1800;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+.08);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(f);f.connect(g);g.connect(bgmMaster);
  o.start(start);o.stop(start+dur+.03);
}
function bgmPhrase(){
  if(!bgmOn||!audioCtx)return;
  const now=audioCtx.currentTime+.05;
  const chord=bgmProgressions[bgmStep%bgmProgressions.length];
  chord.forEach((f,i)=>playTone(f/2,now,4.5,.055,'sine'));
  const notes=[chord[0],chord[1],chord[2],chord[1],chord[0]*2];
  notes.forEach((f,i)=>playTone(f,now+i*.82,1.5,.045,i%2?'triangle':'sine'));
  bgmStep++;
}
function startBgm(){
  if(!bgmOn)return;
  ensureAudio();
  if(!bgmTimer){bgmPhrase();bgmTimer=setInterval(bgmPhrase,4100)}
}
function stopBgm(){
  if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}
  if(bgmMaster&&audioCtx){
    const t=audioCtx.currentTime;
    bgmMaster.gain.cancelScheduledValues(t);
    bgmMaster.gain.setTargetAtTime(.0001,t,.08);
    setTimeout(()=>{if(bgmMaster&&bgmOn===false)bgmMaster.gain.value=.055},300);
  }
}
function setBgm(on){
  bgmOn=on;
  try{localStorage.setItem('kyou_bgm_on',on?'1':'0')}catch(e){}
  const b=document.getElementById('bgmToggle');
  if(b)b.textContent=on?'♫ BGM ON':'♫ BGM OFF';
  if(on){if(bgmMaster)bgmMaster.gain.value=.055;startBgm()}else stopBgm();
}
try{bgmOn=localStorage.getItem('kyou_bgm_on')!=='0'}catch(e){}
